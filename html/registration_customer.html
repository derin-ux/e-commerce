<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Registration | StyleHub</title>
  <link rel="stylesheet" href="registration_customer.css">
</head>
<body>

  <header class="header">
    <a href="index.html" class="logo">Style<span>Hub</span></a>
  </header>

  <main class="login-container">
    <section class="login-card">

      <div class="brand-icon">S</div>

      <p class="eyebrow">JOIN US</p>
      <h1>Create <span>Account</span></h1>

      <p class="subtitle">
        Register for a StyleHub account
      </p>

      <form id="customerRegisterForm">

        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input
            type="text"
            id="fullName"
            name="fullName"
            placeholder="Enter your full name"
            autocomplete="name"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email address"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter your phone number"
            autocomplete="tel"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            autocomplete="new-password"
            minlength="8"
            required
          >
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Re-enter your password"
            autocomplete="new-password"
            minlength="8"
            required
          >
        </div>

        <button type="submit" class="login-button">
          Create Account
        </button>

        <p id="registerMessage" role="status"></p>
      </form>

      <div class="divider"><span>OR</span></div>

      <p class="register-text">
        Already have an account?
        <a href="login.html">Log in</a>
      </p>

      <p class="footer-note">
        Fashion that fits your style.
      </p>

    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/register.js"></script>
</body>
</body>
</html>
