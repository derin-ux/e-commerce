<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | StyleHub</title>
  <link rel="stylesheet" href="../css/login_customer.css">
</head>

<body>
  <header class="header">
    <a href="index.html" class="logo">Style<span>Hub</span></a>
  </header>

  <main class="login-container">
    <section class="login-card">
      
      <!-- <div class="brand-icon">S</div> -->
      <p class="eyebrow">WELCOME BACK</p>
      <h1><span>Login</span></h1>

      <p class="subtitle">
        Sign in to your StyleHub account
      </p>

    <form id="loginForm">

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Enter your email address" autocomplete="off" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password"
          autocomplete="off" required>
      </div>

      <button type="submit" class="login-button">
        Log In
      </button>

      <p id="error" role="status"></p>
    </form>

      <div class="divider"><span>OR</span></div>

      <p class="register-text">
        Don't have an account?
        <a href="../html/registration_customer.html">Create an account</a>
      </p>

      <p class="footer-note">
        Fashion that fits your style.
      </p>

    </section>
  </main>

  <footer class="footer">
    © 2026 StyleHub. All rights reserved.
  </footer>

  <script src="../js/api.js" defer></script>
  <script src="../js/login.js" defer></script>

</body>
</html>
