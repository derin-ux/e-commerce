<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Customer Login | StyleHub</title>

  <link rel="stylesheet" href="login_customer.css">
  <script src="login_customer.js" defer></script>
</head>
<body>

  <header class="header">
    <a href="index.html" class="logo">Style<span>Hub</span></a>

    <a href="shop-owner/login.html" class="owner-link">
      Shop Owner Login
    </a>
  </header>

  <main class="login-container">
    <section class="login-card">

      <div class="brand-icon">S</div>

      <p class="eyebrow">WELCOME BACK</p>
      <h1>Customer <span>Login</span></h1>

      <p class="subtitle">
        Sign in to your StyleHub account to continue shopping
        and manage your orders.
      </p>

      <form id="customerLoginForm">

        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email address"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
        </div>

        <div class="form-options">
          <label class="remember">
            <input type="checkbox" id="rememberMe">
            Remember me
          </label>

          <a href="customer/forgot-password.html">
            Forgot password?
          </a>
        </div>

        <button type="submit" class="login-button">
          Log In
        </button>

        <p id="loginMessage" role="status"></p>
      </form>

      <div class="divider"><span>OR</span></div>

      <p class="register-text">
        Don't have an account?
        <a href="registration_customer.html">Create an account</a>
      </p>

      <p class="footer-note">
        Fashion that fits your style.
      </p>

    </section>
  </main>

  <footer class="footer">
    © 2026 StyleHub. All rights reserved.
  </footer>

</body>
</html>
