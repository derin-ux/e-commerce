<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Settings | StyleHub</title>
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
  <aside class="sidebar">
    <h2 class="logo">StyleHub</h2>
    <p class="sidebar-label">SHOP MANAGEMENT</p>
    <a class="nav-link" href="dashboard.html">Dashboard</a>
    <a class="nav-link" href="product.html">My Products</a>
    <a class="nav-link" href="order.html">Orders</a>
    <a class="nav-link active" href="setting.html">Shop Settings</a>
    <a class="nav-link" href="../index.html">View Store</a>
    <button class="logout-btn" id="logoutBtn">Logout</button>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div>
        <h1>Shop Settings</h1>
        <p>Manage your store's public information.</p>
      </div>
      <a class="primary-btn" href="dashboard.html">Back to Dashboard</a>
    </header>

    <section class="panel" id="shopStatusNote" hidden>
      <h2 id="shopStatusTitle"></h2>
      <p id="shopStatusText"></p>
    </section>

    <section class="panel">
      <h2 style="margin-bottom:20px">Store Information</h2>

      <form id="settingsForm">
        <label for="shopName">Shop Name</label>
        <input id="shopName" name="shopName" required maxlength="80">

        <label for="description">Shop Description</label>
        <textarea id="description" name="description"
          rows="4" maxlength="500"></textarea>

        <label for="email">Contact Email</label>
        <input id="email" name="email" type="email" required>

        <label for="phone">Phone Number</label>
        <input id="phone" name="phone" type="tel" required maxlength="20">

        <label for="city">City</label>
        <input id="city" name="city" placeholder="e.g. Lagos">

        <label for="state">State</label>
        <input id="state" name="state" placeholder="e.g. Lagos State">

        <button class="primary-btn" type="submit" id="saveButton">Save Settings</button>
        <p id="settingsMessage" role="status" aria-live="polite" style="margin-top:15px"></p>
      </form>
    </section>
  </main>

  <script src="../js/api.js" defer></script>
  <script src="../js/setting.js" defer></script>

</body>
</html>
